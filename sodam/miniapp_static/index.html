<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>혜택 메뉴</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 방 전용 혜택 화면 — 애플식(오너 요청 2026-10-12): 텔레그램 밝음/어두움을 따라가는 바탕 + 방장이 고른 강조색(--accent)·배경 그림.
   글자는 전부 textContent (방장 글을 HTML 로 안 씀). 레이아웃: 큰 제목 → 히어로 카드 → 탭(분할 버튼) → 내용 카드 */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --label:#1c1c1e; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.12);
  --accent:#f2c14e; --on-accent:#111; --ink:#9a6b00; --bg1:#0d1633; --bg2:#2c3f86;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --spring:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root.dark{
  --bg:#000; --card:#1c1c1e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--label);-webkit-font-smoothing:antialiased;
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.01em}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom,0px))}
/* 위쪽 막대: 내리면 유리처럼 비치며 작은 제목 */
.bar{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(11px + env(safe-area-inset-top,0px)) 16px 11px;display:flex;justify-content:center;
  font-size:17px;font-weight:600;color:var(--label);opacity:0;transition:opacity .25s var(--spring);pointer-events:none;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep)}
.bar.on{opacity:1}
.eyebrow{margin:14px 0 0;font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
h1{margin:2px 0 14px;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
/* 히어로: 방 배경 그림 (없으면 방 색 그라데이션) */
.hero{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/7;box-shadow:var(--shadow);
  background:linear-gradient(135deg,var(--bg1),var(--bg2)) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55))}
.hero .cap{position:absolute;left:18px;right:18px;bottom:14px;z-index:1;color:#fff}
.hero .cap b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.hero .cap span{font-size:14px;opacity:.85}
/* 분할 버튼 (iOS 세그먼트) */
.seg{position:relative;display:flex;margin:18px 0 16px;padding:2px;border-radius:10px;background:var(--fill)}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:8px;background:var(--card);
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .35s var(--spring),width .35s var(--spring)}
:root.dark .seg .thumb{background:#636366}
.seg[hidden]{display:none}
.seg button{position:relative;z-index:1;flex:1;border:0;background:none;color:var(--label);font:inherit;font-size:13px;font-weight:600;
  padding:7px 4px;cursor:pointer;border-radius:8px;white-space:nowrap}
main{animation:in .45s var(--spring)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:grid;gap:14px}
.card p{margin:0}
.sub{color:var(--label2);font-size:15px}
.foot{color:var(--label2);font-size:13px;text-align:center;margin:12px 8px 0}
.title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.btn{appearance:none;border:0;border-radius:14px;padding:15px;width:100%;font:inherit;font-size:17px;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--on-accent);transition:transform .15s var(--spring),opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4}
.btn.tint{background:var(--fill);color:var(--ink)}
:root.dark .btn.tint{color:var(--accent)}
/* 🎟 복권 = 지갑 카드 */
.pass{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:16px 16px 14px;display:grid;gap:12px;
  background:linear-gradient(145deg,var(--bg2),var(--bg1));box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pass .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;opacity:.9}
.pass .top b{font-size:15px;letter-spacing:-.01em}
.pass .low{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.pass .low b{font-size:17px;font-weight:700;opacity:1}
.scratch{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:rgba(255,255,255,.1)}
.res{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px}
.res .t{font-size:clamp(30px,10vw,46px);font-weight:800;letter-spacing:-.03em;color:var(--accent);text-shadow:0 0 24px rgba(255,255,255,.18)}
.res .s{margin-top:4px;font-size:15px;opacity:.9}
canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s var(--spring);cursor:grab}
canvas.gone{opacity:0;pointer-events:none}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:7px;height:11px;border-radius:2px;animation:fall 1.9s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(380px) rotate(560deg);opacity:0}}
.empty{display:grid;place-items:center;gap:6px;padding:26px 8px;text-align:center}
.empty .ico{font-size:44px}
/* 📅 출석 = 링 + 달력 */
.ringrow{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--fill2)}
.ring .fg{stroke:var(--accent);transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s var(--spring)}
.ringrow .big{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;text-align:center}
.cal b{font-size:12px;color:var(--label2);font-weight:600;padding-bottom:4px}
.cal span{position:relative;height:38px;display:grid;place-items:center;font-size:16px;font-variant-numeric:tabular-nums}
.cal span.on::before{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:var(--accent);z-index:0;animation:pop .45s var(--spring)}
.cal span.on{color:var(--on-accent);font-weight:700}
.cal span i{position:relative;z-index:1;font-style:normal}
.cal span.today:not(.on) i{color:var(--ink);font-weight:700}
:root.dark .cal span.today:not(.on) i{color:var(--accent)}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
/* 🔮 운세 = 뒤집는 카드 */
.flip{perspective:1000px;cursor:pointer}
.flip .in{display:grid;min-height:300px;transition:transform .8s var(--spring);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:grid;place-items:center;
  padding:22px;text-align:center;box-shadow:var(--shadow)}
.front{background:linear-gradient(145deg,var(--bg2),var(--bg1));color:#fff}
.front .ico{font-size:54px}
.back{transform:rotateY(180deg);background:var(--card);align-content:center;gap:10px}
.back .grade{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
:root.dark .back .grade{color:var(--accent)}
.rows{display:grid;gap:8px;text-align:left;width:100%}
.rows div{display:flex;gap:10px;font-size:15px;line-height:1.35}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--fill);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
/* 🌟 추천픽 = 묶음 목록 */
.list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{padding:14px 16px;display:grid;gap:8px;position:relative}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--label2)}
.tag{background:var(--fill);color:var(--label);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600}
.row .teams{font-size:17px;font-weight:600;letter-spacing:-.01em}
.split{display:flex;gap:3px;height:6px}
.split i{border-radius:3px;background:var(--accent)}
.split i+i{background:var(--fill2)}
.pct{display:flex;justify-content:space-between;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.load{padding:80px 10px;text-align:center;color:var(--label2)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);z-index:9;
  background:color-mix(in srgb,var(--card) 82%,transparent);color:var(--label);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  padding:11px 18px;border-radius:22px;font-size:15px;font-weight:600;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.14);
  opacity:0;transition:opacity .3s var(--spring),transform .4s var(--spring);pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar">혜택 메뉴</div>
  <p class="eyebrow" id="eb">오늘의 혜택</p>
  <h1 id="nm">혜택 메뉴</h1>
  <div class="hero" id="hd"><div class="cap"><b id="hn"></b><span id="hs"></span></div></div>
  <nav class="seg" id="tabs" role="tablist"><span class="thumb" id="thumb"></span></nav>
  <main id="main"><div class="load" id="load">불러오는 중…</div></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand();
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast("7.7")) tg.disableVerticalSwipes(); } catch(e) {} }   // 아래로 문질러도 창이 안 내려가게
  const q = new URLSearchParams(location.search);
  const ROOM = (q.get("r") || "").replace(/[^0-9a-f]/g, "").slice(0, 10);
  const START = q.get("t") || "";
  const initData = tg ? tg.initData : "";
  let S = null, busy = false, PENDING = null;   // PENDING = 긁기 시작한 복권의 결과 (서버가 이미 정함)
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fill = (tpl, v) => String(tpl || "").replace(/\{([a-z_]+)\}/g, (_, k) => v[k] != null ? v[k] : "");
  function toast(t){ const x=$("toast"); x.textContent=t; x.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>x.classList.remove("show"),2600); }
  function haptic(kind){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); }catch(e){} }
  function tick(){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); }catch(e){} }
  async function api(action, extra){
    let r;
    try {
      r = await fetch("api/" + action, {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(Object.assign({initData: initData, room: ROOM}, extra || {}))});
    } catch(e) { throw new Error("연결이 안 돼요. 잠시 후 다시 해 주세요"); }
    let j = null; try { j = await r.json(); } catch(e) {}
    if (!r.ok || !j || typeof j !== "object") throw new Error((j && j.error) || "잠시 후 다시 해 주세요");
    return j;
  }
  // 밝음/어두움: 텔레그램 설정을 따라감 (없으면 기기 설정)
  function scheme(){
    const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", dark);
    const bg = dark ? "#000000" : "#f2f2f7";
    try { tg && tg.setHeaderColor && tg.setHeaderColor(bg); tg && tg.setBackgroundColor && tg.setBackgroundColor(bg);
          tg && tg.setBottomBarColor && tg.setBottomBarColor(bg); } catch(e){}
  }
  // 강조색 위 글자색·밝은 바탕에서 읽히는 진한 강조색 (금색 글자가 흰 바탕에서 안 보이는 것 막기)
  function rgb(h){ const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return [242,193,78]; const n = parseInt(m[1],16); return [n>>16&255, n>>8&255, n&255]; }
  function lum(c){ const f = v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }; return .2126*f(c[0]) + .7152*f(c[1]) + .0722*f(c[2]); }
  function hex(c){ return "#" + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,"0")).join(""); }
  function paint(){
    const c = S.colors, st = document.documentElement.style, a = rgb(c.accent);
    st.setProperty("--bg1", c.bg1); st.setProperty("--bg2", c.bg2); st.setProperty("--accent", c.accent);
    st.setProperty("--on-accent", lum(a) > .45 ? "#111" : "#fff");
    let ink = a.slice(); while (lum(ink) > .18) ink = ink.map(v => v * .88);   // 흰 바탕에서 4.5:1 쯤 될 때까지 어둡게
    st.setProperty("--ink", hex(ink));
    const name = S.name || "혜택 메뉴";
    $("nm").textContent = name; $("bar").textContent = name; $("hn").textContent = name;
    $("hs").textContent = S.lotto && S.lotto.on && S.lotto.prize ? "이번 주 경품 · " + S.lotto.prize : "출석하고 오늘의 운세도 확인해 보세요";
    const days = ["일","월","화","수","목","금","토"], d = new Date();
    $("eb").textContent = (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + days[d.getDay()] + "요일";
    if (S.bg) $("hd").style.backgroundImage = "url(" + S.bg + ")";
  }
  const NAMES = {lotto:"복권", checkin:"출석", fortune:"운세", picks:"추천픽"};
  function tabs(){
    const nav = $("tabs"); nav.querySelectorAll("button").forEach(b => b.remove());
    const list = S.tabs.length ? S.tabs : ["checkin"];
    list.forEach(k => { const b = el("button", "", NAMES[k]); b.setAttribute("role","tab"); b.onclick = () => { tick(); show(k); }; b.dataset.k = k; nav.appendChild(b); });
    if (list.length < 2) nav.hidden = true;
    show(list.includes(START) ? START : list[0]);
  }
  function moveThumb(){
    const on = document.querySelector('.seg button[aria-selected="true"]'), th = $("thumb");
    if (!on) return;
    th.style.width = on.offsetWidth + "px"; th.style.transform = "translateX(" + (on.offsetLeft - 2) + "px)";
  }
  function show(k){
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k));
    moveThumb();
    const old = $("main"), m = el("main"); m.id = "main"; old.replaceWith(m);
    ({lotto: vLotto, checkin: vCheckin, fortune: vFortune, picks: vPicks})[k](m);
  }
  window.addEventListener("resize", moveThumb);
  window.addEventListener("scroll", () => { const on = window.scrollY > 70; $("bar").classList.toggle("on", on); $("toast").style.top = on ? "56px" : ""; }, {passive: true});

  // 🎟 복권 = 지갑 카드. 결과는 서버가 정함 (긁기 시작하는 순간 api/scratch), 화면은 보여 주기만
  function vLotto(m){
    const L = S.lotto;
    if (!L.on) { const c = el("div","card"); c.appendChild(el("div","empty")).append(el("div","ico","🎟"), el("p","sub","이 방은 지금 복권이 꺼져 있어요.")); m.appendChild(c); return; }
    if (L.left <= 0 && !PENDING) {
      const c = el("div","card"), e = el("div","empty");
      e.append(el("div","ico","🎟"), el("p","title","복권이 없어요"), el("p","sub","출석하면 하루 1장 받아요."));
      const b = el("button","btn","출석하러 가기"); b.onclick = () => { tick(); show("checkin"); };
      c.append(e, b); m.appendChild(c); return;
    }
    const pass = el("div","pass"), top = el("div","top");
    top.append(el("b","", S.name || "행운의 복권"), el("span","", "LUCKY TICKET"));
    const box = el("div","scratch"), res = el("div","res"), cv = el("canvas"), conf = el("div","confetti");
    const t = el("div","t",""), s = el("div","s","");
    const inner = el("div"); inner.append(t, s); res.appendChild(inner);
    box.append(res, cv, conf);
    const low = el("div","low"), leftEl = el("b","", String(L.left) + "장");
    const l1 = el("div"); l1.append(el("div","","남은 복권"), leftEl);
    const l2 = el("div"); l2.style.textAlign = "right"; l2.append(el("div","","유효 기간"), el("b","", L.life === "day" ? "오늘 자정까지" : "받은 뒤 7일"));
    low.append(l1, l2);
    pass.append(top, box, low); m.appendChild(pass);
    const hint = el("p","foot","손가락으로 은박을 문질러 보세요 · 긁기 시작하면 복권 1장이 쓰여요"); m.appendChild(hint);
    if (S.notice) m.appendChild(el("p","foot", S.notice));
    let ctx, drawing=false, last=null, result=null, done=false, LW=1, LH=1;
    function foil(){
      const r = box.getBoundingClientRect(), d = window.devicePixelRatio || 1;
      LW = r.width; LH = r.height;                           // 그린 때 크기 — 화면이 바뀌어도 손가락 위치를 이 크기로 맞춤
      cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d);
      ctx = cv.getContext("2d"); ctx.setTransform(d,0,0,d,0,0);
      const w=r.width,h=r.height,g=ctx.createLinearGradient(0,0,w,h);
      g.addColorStop(0,"#c7c9cf"); g.addColorStop(.42,"#f4f5f7"); g.addColorStop(.5,"#dfe1e5"); g.addColorStop(1,"#aeb2ba");
      ctx.globalCompositeOperation="source-over"; ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      for (let i=0;i<w*h/90;i++){ ctx.fillStyle = "rgba(255,255,255," + (Math.random()*.18) + ")"; ctx.fillRect(Math.random()*w, Math.random()*h, 1, 1); }   // 은박 결
      ctx.fillStyle="#6e727c"; ctx.textAlign="center"; ctx.textBaseline="middle";
      const title = S.texts.lotto_title || "긁어서 확인!", fam = getComputedStyle(document.body).fontFamily;
      let fs = Math.round(w/10); ctx.font = "700 "+fs+"px "+fam;
      while (fs > 12 && ctx.measureText(title).width > w*0.86) { fs -= 2; ctx.font = "700 "+fs+"px "+fam; }   // 긴 글은 줄여서
      ctx.fillText(title, w/2, h/2);
    }
    function pos(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*LW/r.width, y:(e.clientY-r.top)*LH/r.height}; }
    function rub(pt){ ctx.globalCompositeOperation="destination-out"; ctx.lineCap="round"; ctx.lineWidth=36;
      ctx.beginPath(); ctx.moveTo((last||pt).x,(last||pt).y); ctx.lineTo(pt.x,pt.y); ctx.stroke(); last=pt; }
    function cleared(){ const d=ctx.getImageData(0,0,cv.width,cv.height).data; let n=0,c=0; for(let i=3;i<d.length;i+=64){c++; if(d[i]===0)n++;} return c?n/c:0; }
    function showResult(res){
      if (res.result === "none" || res.result === "off" || res.result === "error") {
        done = true; PENDING = null; cv.classList.add("gone"); t.textContent = res.result === "error" ? "다시 열어 주세요" : "복권이 없어요"; s.textContent = "";
      } else { t.textContent = res.title || ""; s.textContent = (res.sub || "") + (res.contact ? "  ·  @" + res.contact + " 로 연락" : ""); }
      S.lotto.left = res.left != null ? res.left : S.lotto.left;
      leftEl.textContent = S.lotto.left + "장";
    }
    async function ask(){
      if (!PENDING) {                                        // 한 장에 한 번만 (칸을 바꿨다 와도 이어서 — 리뷰: 2장 쓰이던 것)
        PENDING = api("scratch").catch(e => { toast(e.message); return {result:"error"}; });
      }
      result = await PENDING;
      showResult(result);
      maybeReveal();
    }
    function maybeReveal(){
      if (done || !result || cleared() < .45) return;
      done = true; cv.classList.add("gone"); PENDING = null;
      if (result.result === "win") { haptic("success"); burst(conf); hint.textContent = "🎉 축하해요! 1:1 채팅에도 당첨 안내를 보냈어요"; }
      else { haptic("warning"); hint.textContent = "다음 기회에! 내일 출석하면 새 복권"; }
      if (S.lotto.left > 0) { const b = el("button","btn","다음 복권 긁기 · " + S.lotto.left + "장"); b.style.marginTop = "14px"; b.onclick = () => { tick(); show("lotto"); }; m.appendChild(b); }
    }
    if (PENDING) { hint.textContent = "아까 긁던 복권이에요 · 마저 긁어 보세요"; ask(); }
    cv.addEventListener("pointerdown", e => { if (done) return; drawing = true; last = null; cv.setPointerCapture(e.pointerId); rub(pos(e)); ask(); });
    cv.addEventListener("pointermove", e => { if (drawing && !done) rub(pos(e)); });
    const up = () => { if (!drawing) return; drawing = false; last = null; maybeReveal(); };
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    requestAnimationFrame(foil);
  }
  function burst(box){
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cols = [getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#f2c14e","#ff6b6b","#5ac8fa","#34c759","#ffffff","#af52de"];
    for (let i=0;i<80;i++){ const c=el("i"); c.style.left=Math.random()*100+"%"; c.style.background=cols[i%cols.length];
      c.style.animationDelay=(Math.random()*.4)+"s"; box.appendChild(c); }
  }

  // 📅 출석 = 이번 주 링(연속 일수 7일 단위) + 이번 달 달력
  function vCheckin(m){
    const C = S.checkin, c = el("div","card"); m.appendChild(c);
    const row = el("div","ringrow"), NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 100 100"); svg.setAttribute("class","ring");
    const R = 42, L = 2*Math.PI*R, prog = C.streak ? ((C.streak - 1) % 7 + 1) / 7 : 0;
    [["bg", 0], ["fg", 1]].forEach(([cls, isFg]) => { const ci = document.createElementNS(NS,"circle");
      ci.setAttribute("cx","50"); ci.setAttribute("cy","50"); ci.setAttribute("r", R); ci.setAttribute("class", cls);
      if (isFg) { ci.setAttribute("stroke-dasharray", L); ci.setAttribute("stroke-dashoffset", L); requestAnimationFrame(() => ci.setAttribute("stroke-dashoffset", L * (1 - prog))); }
      svg.appendChild(ci); });
    const txt = el("div"); txt.append(el("div","big", C.streak ? fill(S.tpl.checkin_title, {streak: C.streak}) : "출석 시작"),
                                      el("div","sub", fill(S.tpl.checkin_sub, {month: C.days.length})));
    row.append(svg, txt); c.appendChild(row);
    const [y, mo] = C.month.split("-").map(Number);
    const first = new Date(y, mo-1, 1).getDay(), lastDay = new Date(y, mo, 0).getDate(), today = C.todayn;
    const cal = el("div","cal");
    "일월화수목금토".split("").forEach(d => cal.appendChild(el("b","",d)));
    for (let i=0;i<first;i++) cal.appendChild(el("span"));
    for (let d=1; d<=lastDay; d++){ const x = el("span"); x.appendChild(el("i","",String(d)));
      if (C.days.includes(d)) x.classList.add("on"); if (d===today) x.classList.add("today"); cal.appendChild(x); }
    c.appendChild(cal);
    const b = el("button","btn", C.today ? "오늘 출석 완료" : "오늘 출석하기");
    b.disabled = C.today || busy;
    b.onclick = async () => {
      if (busy) return; busy = true; b.disabled = true;
      try { const r = await api("checkin"); S = r.state; haptic("success"); toast(r.message || "출석!"); show("checkin");
            if (r.ticket) setTimeout(() => toast("🎟 복권 1장 받았어요 · 복권 탭에서 긁어 보세요"), 1600); }
      catch(e){ toast(e.message); b.disabled = false; }
      busy = false;
    };
    c.appendChild(b);
  }

  // 🔮 운세 = 뒤집는 카드 (하루 동안 같음)
  function vFortune(m){
    const F = S.fortune, w = el("div","flip"), inn = el("div","in"), front = el("div","face front"), back = el("div","face back");
    const f1 = el("div"); f1.append(el("div","ico","🔮"), el("p","title","오늘의 운세"), el("p","", "탭해서 뒤집기"));
    f1.lastChild.style.opacity = ".8"; front.appendChild(f1);
    back.appendChild(el("div","grade", fill(S.tpl.fortune_title, {grade: F.grade})));
    back.appendChild(el("p","sub", F.overall));
    const rows = el("div","rows");
    [["💰", F.money], ["💕", F.love], ["💪", F.health]].forEach(([i, t]) => { const r = el("div"); r.append(el("span","",i), el("span","",t)); rows.appendChild(r); });
    back.appendChild(rows);
    const chips = el("div","chips"); chips.append(el("span","chip","행운 숫자 " + F.number), el("span","chip","행운 색 " + F.color)); back.appendChild(chips);
    back.appendChild(el("p","sub", F.tip));
    inn.append(front, back); w.appendChild(inn); m.appendChild(w);
    m.appendChild(el("p","foot","재미로 보는 운세예요 · 하루 동안 같아요"));
    w.onclick = () => { w.classList.toggle("open"); haptic("success"); };
  }

  // 🌟 추천픽 = 묶음 목록 (오늘 경기 + 많이 고른 쪽)
  function vPicks(m){
    if (!S.picks.length) { const c = el("div","card"); c.appendChild(el("div","empty")).append(el("div","ico","🌙"), el("p","sub","오늘 남은 주요 리그 경기가 없어요.")); m.appendChild(c); return; }
    const list = el("div","list"); m.appendChild(list);
    S.picks.forEach(g => {
      const r = el("div","row"), meta = el("div","meta");
      meta.append(el("span","tag", g.tag), el("span","", g.time)); r.appendChild(meta);
      r.appendChild(el("div","teams", g.home + "  vs  " + g.away));
      if (g.n) { const sp = el("div","split"), a = el("i"), b = el("i"); a.style.flex = Math.max(1, g.home_pct); b.style.flex = Math.max(1, g.away_pct);
                 sp.append(a, b); r.appendChild(sp);
                 const pc = el("div","pct"); pc.append(el("span","", g.home_pct + "%"), el("span","", g.n + "명이 골랐어요"), el("span","", g.away_pct + "%")); r.appendChild(pc); }
      else r.appendChild(el("div","pct","아직 아무도 안 골랐어요"));
      list.appendChild(r);
    });
    m.appendChild(el("p","foot","1:1 메뉴 🌟 에서 직접 고르고 분석도 볼 수 있어요 · 돈·포인트는 걸지 않아요"));
  }

  scheme();
  if (tg && tg.onEvent) tg.onEvent("themeChanged", scheme);
  (async () => {
    if (!initData) { $("load").textContent = "텔레그램 안에서 열어 주세요."; return; }
    try { S = await api("state"); if (!S.colors || !S.lotto) throw new Error("잠시 후 다시 열어 주세요"); paint(); tabs(); }
    catch(e){ $("load").textContent = e.message; }
  })();
})();
</script>
</body>
</html>
