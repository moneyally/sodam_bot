<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>혜택 메뉴</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 방 전용 혜택 화면. 모양은 텔레그램 미니앱 공개 디자인 TelegramUI(github.com/Telegram-Mini-Apps/TelegramUI,
   MIT License, Copyright (c) 2024 XeleneStudio)의 iOS 부품(AppRoot 색 토큰·Section·Cell·SegmentedControl·Banner·
   Button·Badge·Avatar·Placeholder·Snackbar)을 그대로 옮겨 씀 — 색은 텔레그램이 넣어 주는 --tg-theme-* (사용자 테마 그대로).
   방장 색(--accent·--bg1·--bg2)은 복권 카드·출석 링·1등 같은 '방 브랜드' 자리에만. 글자는 전부 textContent (방장 글을 HTML 로 안 씀). */
:root{
  --tgui--font-family:system-ui,-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Roboto","Apple SD Gothic Neo","Noto Sans KR","Apple Color Emoji","Helvetica Neue",sans-serif;
  --tgui--border--width:1px;
  --tgui--bg_color:var(--tg-theme-bg-color,#FFFFFF);
  --tgui--text_color:var(--tg-theme-text-color,#000000);
  --tgui--hint_color:var(--tg-theme-hint-color,#707579);
  --tgui--link_color:var(--tg-theme-link-color,#007AFF);
  --tgui--button_color:var(--tg-theme-button-color,#007AFF);
  --tgui--button_text_color:var(--tg-theme-button-text-color,#FFFFFF);
  --tgui--secondary_bg_color:var(--tg-theme-secondary-bg-color,#EFEFF4);
  --tgui--accent_text_color:var(--tg-theme-accent-text-color,#007AFF);
  --tgui--section_bg_color:var(--tg-theme-section-bg-color,#FFFFFF);
  --tgui--section_header_text_color:var(--tg-theme-section-header-text-color,#707579);
  --tgui--subtitle_text_color:var(--tg-theme-subtitle-text-color,#707579);
  --tgui--divider:rgba(0,0,0,.15);
  --tgui--tertiary_bg_color:#F4F4F7;
  --tgui--quartenary_bg_color:#F6F6FA;
  --tgui--segmented_control_active_bg:#FFFFFF;
  --tgui--secondary_hint_color:#A2ACB0;
  --tgui--secondary_fill:color-mix(in srgb,var(--tgui--accent_text_color) 10%,transparent);
  --tgui--plain_background:rgba(0,0,0,.04);
  --tgui--plain_foreground:rgba(0,0,0,.8);
  --tgui--surface_dark:rgba(56,56,56,.85);
  --accent:#f2c14e; --on-accent:#111; --ink:#9a6b00; --bg1:#0d1633; --bg2:#2c3f86;
  --spring:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root.dark{
  --tgui--bg_color:var(--tg-theme-bg-color,#212121);
  --tgui--text_color:var(--tg-theme-text-color,#FFFFFF);
  --tgui--hint_color:var(--tg-theme-hint-color,#AAAAAA);
  --tgui--link_color:var(--tg-theme-link-color,#2990FF);
  --tgui--button_color:var(--tg-theme-button-color,#2990FF);
  --tgui--secondary_bg_color:var(--tg-theme-secondary-bg-color,#0F0F0F);
  --tgui--section_bg_color:var(--tg-theme-section-bg-color,#212121);
  --tgui--section_header_text_color:var(--tg-theme-section-header-text-color,#AAAAAA);
  --tgui--subtitle_text_color:var(--tg-theme-subtitle-text-color,#AAAAAA);
  --tgui--divider:rgba(255,255,255,.05);
  --tgui--tertiary_bg_color:#2A2A2A;
  --tgui--quartenary_bg_color:#2F2F2F;
  --tgui--segmented_control_active_bg:#2F2F2F;
  --tgui--secondary_hint_color:#78797E;
  --tgui--secondary_fill:color-mix(in srgb,var(--tgui--accent_text_color) 15%,transparent);
  --tgui--plain_background:rgba(255,255,255,.08);
  --tgui--plain_foreground:rgba(255,255,255,.95);
  color-scheme:dark;
}
@media (min-resolution:2dppx){:root{--tgui--border--width:.5px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--tgui--secondary_bg_color);color:var(--tgui--text_color);font-family:var(--tgui--font-family);
  font-size:17px;line-height:22px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px))}
/* Typography (TelegramUI iOS 줄 높이) */
.large-title{margin:8px 0 0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.02em}
.caption{font-size:13px;line-height:16px}
.sub{color:var(--tgui--hint_color)}
/* Banner (withBackground) */
.banner{position:relative;overflow:hidden;display:flex;align-items:flex-end;min-height:132px;margin:14px 0 0;padding:20px;border-radius:16px;
  background:linear-gradient(135deg,var(--bg1),var(--bg2)) center/cover no-repeat;color:#fff}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55))}
.banner .mid{position:relative;display:flex;flex-direction:column;gap:2px}
.banner b{font-size:20px;line-height:25px;font-weight:600}
.banner span{font-size:15px;line-height:20px;opacity:.8}
/* SegmentedControl (iOS) */
.seg{position:relative;display:flex;margin:16px 0 4px;padding:2px;border-radius:9px;background:var(--tgui--tertiary_bg_color)}
:root.dark .seg{background:var(--tgui--tertiary_bg_color)}
.seg[hidden]{display:none}
.seg .slider{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--tgui--segmented_control_active_bg);
  border:var(--tgui--border--width) solid rgba(0,0,0,.04);box-shadow:0 3px 1px 0 rgba(0,0,0,.04),0 3px 8px 0 rgba(0,0,0,.12);
  transition:transform 150ms,width 150ms}
.seg button{position:relative;z-index:1;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:6px 4px;border:0;border-radius:7px;background:transparent;color:var(--tgui--text_color);font:inherit;font-size:13px;line-height:18px;font-weight:600;cursor:pointer}
main{animation:in .3s var(--spring)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Section · Cell (iOS) */
.section{margin-top:22px}
.sh{padding:0 16px 8px;color:var(--tgui--section_header_text_color);font-size:13px;line-height:16px;text-transform:uppercase;letter-spacing:.02em}
.sb{border-radius:12px;background:var(--tgui--section_bg_color);overflow:hidden}
.sf{padding:8px 16px 0;color:var(--tgui--section_header_text_color);font-size:13px;line-height:18px;white-space:pre-line}
.cell{display:flex;align-items:center;gap:16px;padding:0 16px;position:relative}
.cell .mid{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0;padding:12px 0}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:var(--tgui--border--width);background:var(--tgui--divider)}
.cell.wa{--inset:72px}
.cell .t{font-size:17px;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .s{font-size:15px;line-height:20px;color:var(--tgui--hint_color);overflow:hidden;text-overflow:ellipsis}
.cell .after{flex:none;color:var(--tgui--hint_color);font-size:17px;line-height:22px;font-variant-numeric:tabular-nums}
.cell.me{background:var(--tgui--secondary_fill)}
.cell.me .t{font-weight:600}
.pad{padding:16px}
/* Avatar (acronym) · Badge */
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--tgui--secondary_fill);
  color:var(--tgui--link_color);font-size:17px;font-weight:600}
.av.emo{background:transparent;font-size:28px}
.av.r1{background:linear-gradient(145deg,#ffe58a,#e2a400);color:#5a3d00}
.av.r2{background:linear-gradient(145deg,#f2f4f7,#a9b1bd);color:#3a4250}
.av.r3{background:linear-gradient(145deg,#ffd0a6,#c67a3a);color:#4d2a10}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:20px;font-size:13px;line-height:16px;font-weight:600;
  color:var(--tgui--link_color);background:var(--tgui--secondary_fill);white-space:nowrap}
.badge.gray{color:var(--tgui--plain_foreground);background:var(--tgui--plain_background)}
.badge.brand{color:var(--on-accent);background:var(--accent)}
/* Button (iOS l) */
.btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;margin-top:16px;padding:10px 20px;
  border:0;border-radius:12px;font:inherit;font-size:17px;line-height:22px;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--on-accent);transition:opacity .15s}
.btn:active{opacity:.7}
.btn[disabled]{opacity:.45}
.btn.bezeled{background:var(--tgui--secondary_fill);color:var(--tgui--link_color)}
/* Placeholder */
.ph{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px;text-align:center}
.ph .ico{font-size:56px;line-height:1}
.ph .t{font-size:20px;line-height:25px;font-weight:600}
.ph .d{color:var(--tgui--hint_color);font-size:15px;line-height:20px}
/* 🎟 복권 = 방 브랜드 카드 */
.pass{position:relative;margin-top:22px;border-radius:16px;overflow:hidden;color:#fff;padding:16px;display:grid;gap:12px;
  background:linear-gradient(145deg,var(--bg2),var(--bg1));box-shadow:0 10px 30px rgba(0,0,0,.16)}
.pass .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;line-height:16px;font-weight:600;opacity:.9}
.pass .top b{font-size:15px}
.scratch{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:rgba(255,255,255,.1)}
.res{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px}
.res .t{font-size:clamp(30px,10vw,44px);font-weight:800;letter-spacing:-.03em;color:var(--accent);text-shadow:0 0 24px rgba(255,255,255,.18)}
.res .s{margin-top:4px;font-size:15px;opacity:.9}
canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s var(--spring);cursor:grab}
canvas.gone{opacity:0;pointer-events:none}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:7px;height:11px;border-radius:2px;animation:fall 1.9s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(380px) rotate(560deg);opacity:0}}
/* 📅 출석 = 링 + 달력 */
.ringrow{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:var(--tgui--tertiary_bg_color)}
.ring .fg{stroke:var(--accent);transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s var(--spring)}
.ringrow .big{font-size:24px;line-height:28px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;text-align:center;margin-top:14px}
.cal b{font-size:13px;line-height:16px;color:var(--tgui--hint_color);font-weight:600;padding-bottom:6px}
.cal span{position:relative;height:38px;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.cal span.on::before{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:var(--accent);animation:pop .45s var(--spring)}
.cal span.on{color:var(--on-accent);font-weight:600}
.cal span i{position:relative;font-style:normal}
.cal span.today:not(.on) i{color:var(--tgui--link_color);font-weight:700}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
/* 🔮 운세 = 뒤집는 카드 */
.flip{perspective:1000px;cursor:pointer;margin-top:22px}
.flip .in{display:grid;min-height:290px;transition:transform .8s var(--spring);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden}
.front{display:grid;place-items:center;text-align:center;padding:22px;background:linear-gradient(145deg,var(--bg2),var(--bg1));color:#fff}
.front .ico{font-size:56px}
.front b{display:block;margin-top:8px;font-size:20px;line-height:25px}
.front span{font-size:15px;opacity:.8}
.back{transform:rotateY(180deg);background:var(--tgui--section_bg_color)}
.back .head{padding:18px 16px 6px;text-align:center}
.back .grade{font-size:28px;line-height:34px;font-weight:700;color:var(--ink)}
:root.dark .back .grade{color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:4px 16px 16px}
/* 🌟 픽 = 나눠진 막대 */
.split{display:flex;gap:3px;height:4px;margin-top:6px}
.split i{border-radius:2px;background:var(--accent)}
.split i+i{background:var(--tgui--tertiary_bg_color)}
.load{padding:80px 10px;text-align:center;color:var(--tgui--hint_color)}
/* Snackbar (iOS) — 아래쪽에 떠서 제목을 안 가림 */
.toast{position:fixed;left:10px;right:10px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:460px;margin:0 auto;z-index:9;
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;color:#fff;font-size:15px;line-height:20px;font-weight:500;
  background:var(--tgui--surface_dark);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);
  transform:translate3d(0,140%,0);opacity:0;transition:transform 320ms cubic-bezier(.3,.3,.5,1),opacity .2s;pointer-events:none}
.toast.show{transform:none;opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="caption sub" id="eb">오늘의 혜택</div>
  <h1 class="large-title" id="nm">혜택 메뉴</h1>
  <div class="banner" id="hd"><div class="mid"><b id="hn"></b><span id="hs"></span></div></div>
  <nav class="seg" id="tabs" role="tablist"><span class="slider" id="thumb"></span></nav>
  <main id="main"><div class="load" id="load">불러오는 중…</div></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand();
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast("7.7")) tg.disableVerticalSwipes(); } catch(e) {} }   // 아래로 문질러도 창이 안 내려가게
  const q = new URLSearchParams(location.search);
  const ROOM = (q.get("r") || "").replace(/[^0-9a-f]/g, "").slice(0, 10);
  const START = q.get("t") || "";
  const initData = tg ? tg.initData : "";
  let S = null, busy = false, PENDING = null;   // PENDING = 긁기 시작한 복권의 결과 (서버가 이미 정함)
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fill = (tpl, v) => String(tpl || "").replace(/\{([a-z_]+)\}/g, (_, k) => v[k] != null ? v[k] : "");
  const num = (n) => Number(n || 0).toLocaleString("ko-KR");
  function toast(t){ const x=$("toast"); x.textContent=t; x.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>x.classList.remove("show"),2600); }
  function haptic(kind){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); }catch(e){} }
  function tick(){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); }catch(e){} }
  async function api(action, extra){
    let r;
    try {
      r = await fetch("api/" + action, {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(Object.assign({initData: initData, room: ROOM}, extra || {}))});
    } catch(e) { throw new Error("연결이 안 돼요. 잠시 후 다시 해 주세요"); }
    let j = null; try { j = await r.json(); } catch(e) {}
    if (!r.ok || !j || typeof j !== "object") throw new Error((j && j.error) || "잠시 후 다시 해 주세요");
    return j;
  }
  // 밝음/어두움 + 색: 텔레그램이 넣어 주는 테마(--tg-theme-*)를 그대로. 위·아래 막대도 같은 바탕색으로
  function scheme(){
    const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", dark);
    try { tg && tg.setHeaderColor && tg.setHeaderColor("secondary_bg_color"); tg && tg.setBackgroundColor && tg.setBackgroundColor("secondary_bg_color");
          tg && tg.setBottomBarColor && tg.setBottomBarColor("secondary_bg_color"); } catch(e){}
  }
  // 강조색 위 글자색·밝은 바탕에서 읽히는 진한 강조색 (금색 글자가 흰 바탕에서 안 보이는 것 막기)
  function rgb(h){ const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return [242,193,78]; const n = parseInt(m[1],16); return [n>>16&255, n>>8&255, n&255]; }
  function lum(c){ const f = v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }; return .2126*f(c[0]) + .7152*f(c[1]) + .0722*f(c[2]); }
  function hex(c){ return "#" + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,"0")).join(""); }
  function paint(){
    const c = S.colors, st = document.documentElement.style, a = rgb(c.accent);
    st.setProperty("--bg1", c.bg1); st.setProperty("--bg2", c.bg2); st.setProperty("--accent", c.accent);
    st.setProperty("--on-accent", lum(a) > .45 ? "#111" : "#fff");
    let ink = a.slice(); while (lum(ink) > .18) ink = ink.map(v => v * .88);   // 흰 바탕에서 4.5:1 쯤 될 때까지 어둡게
    st.setProperty("--ink", hex(ink));
    const name = S.name || "혜택 메뉴";
    $("nm").textContent = name; $("hn").textContent = name; document.title = name;
    $("hs").textContent = S.lotto && S.lotto.on && S.lotto.prize ? "이번 주 경품 · " + S.lotto.prize : "출석하고 오늘의 운세도 확인해 보세요";
    const days = ["일","월","화","수","목","금","토"], d = new Date();
    $("eb").textContent = (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + days[d.getDay()] + "요일";
    if (S.bg) $("hd").style.backgroundImage = "url(" + S.bg + ")";
  }
  // TelegramUI 부품을 DOM 으로
  function section(m, header, footer){
    const w = el("div","section"); if (header) w.appendChild(el("div","sh", header));
    const b = el("div","sb"); w.appendChild(b); if (footer) w.appendChild(el("div","sf", footer));
    m.appendChild(w); return b;
  }
  function cell(body, o){
    const c = el("div","cell" + (o.me ? " me" : "") + (o.before && o.before.classList.contains("av") ? " wa" : ""));
    if (o.before) c.appendChild(o.before);
    const mid = el("div","mid"); mid.appendChild(el("div","t", o.title)); if (o.sub) mid.appendChild(el("div","s", o.sub));
    if (o.extra) mid.appendChild(o.extra);
    c.appendChild(mid);
    if (o.after != null) c.appendChild(typeof o.after === "string" ? el("div","after", o.after) : o.after);
    body.appendChild(c); return c;
  }
  function placeholder(m, ico, title, desc){
    const b = section(m), p = el("div","ph"); p.append(el("div","ico",ico));
    if (title) p.appendChild(el("div","t",title)); if (desc) p.appendChild(el("div","d",desc));
    b.appendChild(p); return b;
  }
  const NAMES = {lotto:"복권", checkin:"출석", fortune:"운세", rank:"순위", picks:"추천픽"};
  function tabs(){
    const nav = $("tabs"); nav.querySelectorAll("button").forEach(b => b.remove());
    const list = (S.tabs || []).filter(k => NAMES[k] && (k !== "rank" || S.rank));
    if (!list.length) list.push("checkin");
    list.forEach(k => { const b = el("button", "", NAMES[k]); b.setAttribute("role","tab"); b.onclick = () => { tick(); show(k); }; b.dataset.k = k; nav.appendChild(b); });
    if (list.length < 2) nav.hidden = true;
    show(list.includes(START) ? START : list[0]);
  }
  function moveThumb(){
    const on = document.querySelector('.seg button[aria-selected="true"]'), th = $("thumb");
    if (!on) return;
    th.style.width = on.offsetWidth + "px"; th.style.transform = "translateX(" + (on.offsetLeft - 2) + "px)";
  }
  function show(k){
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k));
    moveThumb();
    const old = $("main"), m = el("main"); m.id = "main"; old.replaceWith(m);
    ({lotto: vLotto, checkin: vCheckin, fortune: vFortune, rank: vRank, picks: vPicks})[k](m);
  }
  window.addEventListener("resize", moveThumb);

  // 🎟 복권 = 브랜드 카드 + 정보 칸. 결과는 서버가 정함 (긁기 시작하는 순간 api/scratch), 화면은 보여 주기만
  function vLotto(m){
    const L = S.lotto;
    if (!L.on) { placeholder(m, "🎟", "복권이 꺼져 있어요", "방 관리자가 켜면 출석할 때마다 1장씩 받아요."); return; }
    if (L.left <= 0 && !PENDING) {
      placeholder(m, "🎟", "복권이 없어요", "출석하면 하루 1장 받아요.");
      const b = el("button","btn","출석하러 가기"); b.onclick = () => { tick(); show("checkin"); }; m.appendChild(b); return;
    }
    const pass = el("div","pass"), top = el("div","top");
    top.append(el("b","", S.name || "행운의 복권"), el("span","", "LUCKY TICKET"));
    const box = el("div","scratch"), res = el("div","res"), cv = el("canvas"), conf = el("div","confetti");
    const t = el("div","t",""), s = el("div","s","");
    const inner = el("div"); inner.append(t, s); res.appendChild(inner);
    box.append(res, cv, conf);
    pass.append(top, box); m.appendChild(pass);
    const info = section(m, null, "손가락으로 은박을 문질러 보세요 · 긁기 시작하면 복권 1장이 쓰여요" + (S.notice ? "\n" + S.notice : ""));
    const leftCell = cell(info, {title: "남은 복권", after: L.left + "장"});
    cell(info, {title: "유효 기간", after: L.life === "day" ? "오늘 자정까지" : "받은 뒤 7일"});
    if (L.prize) { const bd = el("span","badge brand", L.prize); cell(info, {title: "이번 주 경품", after: bd}); }
    const hint = info.parentNode.querySelector(".sf");
    let ctx, drawing=false, last=null, result=null, done=false, LW=1, LH=1;
    function foil(){
      const r = box.getBoundingClientRect(), d = window.devicePixelRatio || 1;
      LW = r.width; LH = r.height;                           // 그린 때 크기 — 화면이 바뀌어도 손가락 위치를 이 크기로 맞춤
      cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d);
      ctx = cv.getContext("2d"); ctx.setTransform(d,0,0,d,0,0);
      const w=r.width,h=r.height,g=ctx.createLinearGradient(0,0,w,h);
      g.addColorStop(0,"#c7c9cf"); g.addColorStop(.42,"#f4f5f7"); g.addColorStop(.5,"#dfe1e5"); g.addColorStop(1,"#aeb2ba");
      ctx.globalCompositeOperation="source-over"; ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      for (let i=0;i<w*h/90;i++){ ctx.fillStyle = "rgba(255,255,255," + (Math.random()*.18) + ")"; ctx.fillRect(Math.random()*w, Math.random()*h, 1, 1); }   // 은박 결
      ctx.fillStyle="#6e727c"; ctx.textAlign="center"; ctx.textBaseline="middle";
      const title = S.texts.lotto_title || "긁어서 확인!", fam = getComputedStyle(document.body).fontFamily;
      let fs = Math.round(w/10); ctx.font = "700 "+fs+"px "+fam;
      while (fs > 12 && ctx.measureText(title).width > w*0.86) { fs -= 2; ctx.font = "700 "+fs+"px "+fam; }   // 긴 글은 줄여서
      ctx.fillText(title, w/2, h/2);
    }
    function pos(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*LW/r.width, y:(e.clientY-r.top)*LH/r.height}; }
    function rub(pt){ ctx.globalCompositeOperation="destination-out"; ctx.lineCap="round"; ctx.lineWidth=36;
      ctx.beginPath(); ctx.moveTo((last||pt).x,(last||pt).y); ctx.lineTo(pt.x,pt.y); ctx.stroke(); last=pt; }
    function cleared(){ const d=ctx.getImageData(0,0,cv.width,cv.height).data; let n=0,c=0; for(let i=3;i<d.length;i+=64){c++; if(d[i]===0)n++;} return c?n/c:0; }
    function showResult(res){
      if (res.result === "none" || res.result === "off" || res.result === "error") {
        done = true; PENDING = null; cv.classList.add("gone"); t.textContent = res.result === "error" ? "다시 열어 주세요" : "복권이 없어요"; s.textContent = "";
      } else { t.textContent = res.title || ""; s.textContent = (res.sub || "") + (res.contact ? "  ·  @" + res.contact + " 로 연락" : ""); }
      S.lotto.left = res.left != null ? res.left : S.lotto.left;
      leftCell.querySelector(".after").textContent = S.lotto.left + "장";
    }
    async function ask(){
      if (!PENDING) {                                        // 한 장에 한 번만 (칸을 바꿨다 와도 이어서 — 리뷰: 2장 쓰이던 것)
        PENDING = api("scratch").catch(e => { toast(e.message); return {result:"error"}; });
      }
      result = await PENDING;
      showResult(result);
      maybeReveal();
    }
    function maybeReveal(){
      if (done || !result || cleared() < .45) return;
      done = true; cv.classList.add("gone"); PENDING = null;
      if (result.result === "win") { haptic("success"); burst(conf); hint.textContent = "🎉 축하해요! 1:1 채팅에도 당첨 안내를 보냈어요"; }
      else { haptic("warning"); hint.textContent = "다음 기회에! 내일 출석하면 새 복권"; }
      if (S.lotto.left > 0) { const b = el("button","btn","다음 복권 긁기 · " + S.lotto.left + "장"); b.onclick = () => { tick(); show("lotto"); }; m.appendChild(b); }
    }
    if (PENDING) { hint.textContent = "아까 긁던 복권이에요 · 마저 긁어 보세요"; ask(); }
    cv.addEventListener("pointerdown", e => { if (done) return; drawing = true; last = null; cv.setPointerCapture(e.pointerId); rub(pos(e)); ask(); });
    cv.addEventListener("pointermove", e => { if (drawing && !done) rub(pos(e)); });
    const up = () => { if (!drawing) return; drawing = false; last = null; maybeReveal(); };
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    requestAnimationFrame(foil);
  }
  function burst(box){
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cols = [getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#f2c14e","#ff6b6b","#5ac8fa","#34c759","#ffffff","#af52de"];
    for (let i=0;i<80;i++){ const c=el("i"); c.style.left=Math.random()*100+"%"; c.style.background=cols[i%cols.length];
      c.style.animationDelay=(Math.random()*.4)+"s"; box.appendChild(c); }
  }

  // 📅 출석 = 이번 주 링(연속 일수 7일 단위) + 이번 달 달력
  function vCheckin(m){
    const C = S.checkin, body = section(m, "이번 달 출석", "출석하면 복권 1장 (방에서 복권을 켰을 때)"), box = el("div","pad");
    body.appendChild(box);
    const row = el("div","ringrow"), NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 100 100"); svg.setAttribute("class","ring");
    const R = 42, L = 2*Math.PI*R, prog = C.streak ? ((C.streak - 1) % 7 + 1) / 7 : 0;
    [["bg", 0], ["fg", 1]].forEach(([cls, isFg]) => { const ci = document.createElementNS(NS,"circle");
      ci.setAttribute("cx","50"); ci.setAttribute("cy","50"); ci.setAttribute("r", R); ci.setAttribute("class", cls);
      if (isFg) { ci.setAttribute("stroke-dasharray", L); ci.setAttribute("stroke-dashoffset", L); requestAnimationFrame(() => ci.setAttribute("stroke-dashoffset", L * (1 - prog))); }
      svg.appendChild(ci); });
    const txt = el("div"); txt.append(el("div","big", C.streak ? fill(S.tpl.checkin_title, {streak: C.streak}) : "출석 시작"),
                                      el("div","s sub", fill(S.tpl.checkin_sub, {month: C.days.length})));
    row.append(svg, txt); box.appendChild(row);
    const [y, mo] = C.month.split("-").map(Number);
    const first = new Date(y, mo-1, 1).getDay(), lastDay = new Date(y, mo, 0).getDate(), today = C.todayn;
    const cal = el("div","cal");
    "일월화수목금토".split("").forEach(d => cal.appendChild(el("b","",d)));
    for (let i=0;i<first;i++) cal.appendChild(el("span"));
    for (let d=1; d<=lastDay; d++){ const x = el("span"); x.appendChild(el("i","",String(d)));
      if (C.days.includes(d)) x.classList.add("on"); if (d===today) x.classList.add("today"); cal.appendChild(x); }
    box.appendChild(cal);
    const b = el("button","btn", C.today ? "오늘 출석 완료" : "오늘 출석하기");
    b.disabled = C.today || busy;
    b.onclick = async () => {
      if (busy) return; busy = true; b.disabled = true;
      try { const r = await api("checkin"); S = r.state; haptic("success"); toast(r.message || "출석!"); show("checkin");
            if (r.ticket) setTimeout(() => toast("🎟 복권 1장 받았어요 · 복권 칸에서 긁어 보세요"), 1600); }
      catch(e){ toast(e.message); b.disabled = false; }
      busy = false;
    };
    m.appendChild(b);
  }

  // 🔮 운세 = 뒤집는 카드 (하루 동안 같음)
  function vFortune(m){
    const F = S.fortune, w = el("div","flip"), inn = el("div","in"), front = el("div","face front"), back = el("div","face back");
    const f1 = el("div"); f1.append(el("div","ico","🔮"), el("b","","오늘의 운세"), el("span","", "탭해서 뒤집기")); front.appendChild(f1);
    const head = el("div","head"); head.append(el("div","grade", fill(S.tpl.fortune_title, {grade: F.grade})), el("div","s sub", F.overall));
    back.appendChild(head);
    const list = el("div");
    [["💰","금전", F.money], ["💕","연애", F.love], ["💪","건강", F.health]].forEach(([i, k, t]) =>
      cell(list, {before: el("div","av emo", i), title: k, sub: t}));
    list.querySelectorAll(".s").forEach(x => { x.style.whiteSpace = "normal"; });
    back.appendChild(list);
    const chips = el("div","chips"); chips.append(el("span","badge gray","행운 숫자 " + F.number), el("span","badge gray","행운 색 " + F.color)); back.appendChild(chips);
    inn.append(front, back); w.appendChild(inn); m.appendChild(w);
    m.appendChild(el("div","sf", F.tip + "\n재미로 보는 운세예요 · 하루 동안 같아요"));
    w.onclick = () => { w.classList.toggle("open"); haptic("success"); };
  }

  // 🏆 채팅 순위 = 방장이 꾸민 순위 (상품·어제 당첨자·내 순위)
  function rankAv(r){
    if (r.icon && !/^\d+\.?$/.test(r.icon) && r.rank > 3) return el("div","av emo", r.icon);
    const a = el("div","av" + (r.rank <= 3 ? " r" + r.rank : ""), String(r.rank)); return a;
  }
  function vRank(m){
    const R = S.rank;
    if (!R || !R.rows.length) { placeholder(m, "🏆", "아직 순위가 없어요", "채팅을 하면 여기에 순위가 쌓여요."); return; }
    const body = section(m, (R.title || (R.label + " 채팅 순위")) + " · " + R.date);
    R.rows.forEach(r => cell(body, {before: rankAv(r), title: r.name, sub: num(r.n) + "회", me: r.me,
                                    after: r.prize ? el("span","badge brand", r.prize) : null}));
    if (R.me && !R.rows.some(r => r.me)) {
      const mine = section(m, "나");
      cell(mine, {before: el("div","av", R.me.rank ? String(R.me.rank) : "–"), me: true,
                  title: R.me.rank ? R.me.rank + "위" : "아직 기록 없음", sub: R.me.n ? num(R.me.n) + "회" : "채팅하면 순위에 올라요"});
    }
    if (R.yday && R.yday.length) {
      const y = section(m, "어제 당첨자 · " + R.ydate);
      R.yday.forEach(r => cell(y, {before: rankAv(r), title: r.name, sub: r.n ? num(r.n) + "회" : "",
                                   after: r.prize ? el("span","badge gray", r.prize) : null}));
    }
    if (R.foot) m.appendChild(el("div","sf", R.foot));
  }

  // 🌟 추천픽 = 오늘 경기 + 많이 고른 쪽
  function vPicks(m){
    if (!S.picks.length) { placeholder(m, "🌙", "오늘 남은 경기가 없어요", "주요 리그 경기가 잡히면 여기에 떠요."); return; }
    const body = section(m, "오늘 주요 경기", "1:1 메뉴 🌟 에서 직접 고르고 분석도 볼 수 있어요 · 돈·포인트는 걸지 않아요");
    S.picks.forEach(g => {
      let extra = null, sub = g.time + " · 아직 아무도 안 골랐어요", after = null;
      if (g.n) { extra = el("div","split"); const a = el("i"), b = el("i"); a.style.flex = Math.max(1, g.home_pct); b.style.flex = Math.max(1, g.away_pct);
                 extra.append(a, b); sub = g.time + " · " + g.n + "명이 골랐어요"; after = g.home_pct + " : " + g.away_pct; }
      cell(body, {before: el("span","badge gray", g.tag), title: g.home + " vs " + g.away, sub: sub, extra: extra, after: after});
    });
  }

  scheme();
  if (tg && tg.onEvent) tg.onEvent("themeChanged", scheme);
  (async () => {
    if (!initData) { $("load").textContent = "텔레그램 안에서 열어 주세요."; return; }
    try { S = await api("state"); if (!S.colors || !S.lotto) throw new Error("잠시 후 다시 열어 주세요"); paint(); tabs(); }
    catch(e){ $("load").textContent = e.message; }
  })();
})();
</script>
</body>
</html>
